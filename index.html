<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Portfolio — in arrivo</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0e0e0e; color: #eee; }
    }
    main { text-align: center; padding: 24px 16px; }
    h1 { font-weight: 500; font-size: clamp(1.25rem, 4vw, 2rem); letter-spacing: .02em; margin: 0 0 .5rem; }
    p { margin: 0; opacity: .6; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>In arrivo</h1>
    <p>Portfolio online a breve.</p>
  </main>
</body>
</html>
